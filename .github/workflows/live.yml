name: Live tests

# Real VideoSDK and Stripe (test mode). Runs on demand and nightly.
# Needs repository secrets: VIDEOSDK_API_KEY, VIDEOSDK_SECRET_KEY,
# STRIPE_SECRET_KEY (sk_test_...), STRIPE_PRICE_ID.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

concurrency:
  group: live-tests
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/devvideochat_test
      NEXT_TELEMETRY_DISABLED: "1"
      VIDEOSDK_API_KEY: ${{ secrets.VIDEOSDK_API_KEY }}
      VIDEOSDK_SECRET_KEY: ${{ secrets.VIDEOSDK_SECRET_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$VIDEOSDK_API_KEY" ] || [ -z "$VIDEOSDK_SECRET_KEY" ] || [ -z "$STRIPE_SECRET_KEY" ] || [ -z "$STRIPE_PRICE_ID" ]; then
            echo "::warning::Live test secrets are not set; skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.secrets.outputs.ok == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ok == 'true'
        run: npx playwright install --with-deps chromium
      - name: Live end-to-end tests
        if: steps.secrets.outputs.ok == 'true'
        run: npm run test:e2e:live
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-live
          path: |
            playwright-report-live/
            test-results-live/
          retention-days: 7
